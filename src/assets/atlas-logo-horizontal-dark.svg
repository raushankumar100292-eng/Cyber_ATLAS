<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 128" role="img" aria-label="ATLAS">
  <defs>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cbbff"/>
      <stop offset="1" stop-color="#1a2f8f"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4570"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="khole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#8fbfff"/>
    </linearGradient>
    <linearGradient id="atri" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#1e6fff"/>
      <stop offset="1" stop-color="#5cb3ff"/>
    </linearGradient>
    <clipPath id="gclip"><circle cx="28" cy="32" r="19"/></clipPath>
    <filter id="wordglow" x="-25%" y="-40%" width="150%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4.5" result="b"/>
      <feFlood flood-color="#5cb3ff" flood-opacity="0.9"/>
      <feComposite in2="b" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- icon -->
  <g transform="translate(4,4) scale(1.875)">
    <circle cx="28" cy="32" r="19" fill="url(#globe)"/>
    <g clip-path="url(#gclip)" fill="none" stroke="#eaf3ff" stroke-opacity="0.5" stroke-width="0.9">
      <line x1="28" y1="13" x2="28" y2="51"/>
      <ellipse cx="28" cy="32" rx="9" ry="19"/>
      <ellipse cx="28" cy="32" rx="15.5" ry="19"/>
      <line x1="9" y1="32" x2="47" y2="32"/>
      <line x1="12" y1="22.5" x2="44" y2="22.5"/>
      <line x1="12" y1="41.5" x2="44" y2="41.5"/>
    </g>
    <circle cx="28" cy="32" r="19" fill="none" stroke="#7fb4ff" stroke-opacity="0.8" stroke-width="1"/>
    <g stroke="#5aa2ff" stroke-width="1.4" fill="none" stroke-linecap="round">
      <path d="M46 22 L50 20 L53.5 18"/>
      <path d="M47 32 H58"/>
      <path d="M46 42 L50 44 L54.5 45"/>
    </g>
    <g fill="#5aa2ff">
      <circle cx="53.5" cy="18" r="2.2"/>
      <circle cx="58" cy="32" r="2.2"/>
      <circle cx="54.5" cy="45" r="2.2"/>
      <circle cx="50" cy="27" r="1.2"/>
      <circle cx="51" cy="36.5" r="1.2"/>
    </g>
    <path d="M17 18 H39 V33 C39 41 33.5 46 28 49 C22.5 46 17 41 17 33 Z"
          fill="url(#shield)" stroke="#6db3ff" stroke-opacity="0.85" stroke-width="1.1"/>
    <circle cx="28" cy="30" r="2.6" fill="url(#khole)"/>
    <path d="M26.2 31.8 H29.8 L31 40 H25 Z" fill="url(#khole)"/>
  </g>

  <!-- wordmark -->
  <g transform="translate(148,14)" filter="url(#wordglow)">
    <g fill="#f4f9ff">
      <path fill-rule="evenodd" d="M42,0 L58,0 L100,100 L72,100 L60,62 L40,62 L28,100 L0,100 Z M50,22 L61,52 L39,52 Z"/>
      <path transform="translate(116,0)" d="M0,0 H84 V22 H53 V100 H31 V22 H0 Z"/>
      <path transform="translate(216,0)" d="M0,0 H22 V78 H66 V100 H0 Z"/>
      <path transform="translate(298,0)" fill-rule="evenodd" d="M42,0 L58,0 L100,100 L72,100 L60,62 L40,62 L28,100 L0,100 Z M50,22 L61,52 L39,52 Z"/>
      <path transform="translate(414,0)" d="M0,0 H80 V22 H0 Z M0,39 H80 V61 H0 Z M0,78 H80 V100 H0 Z M0,0 H22 V61 H0 Z M58,39 H80 V100 H58 Z"/>
    </g>
    <g fill="url(#atri)">
      <path d="M50,62 L66,100 L34,100 Z"/>
      <path transform="translate(298,0)" d="M50,62 L66,100 L34,100 Z"/>
    </g>
  </g>
</svg>
