<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ATLAS">
  <defs>
    <linearGradient id="globe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cbbff"/>
      <stop offset="1" stop-color="#12237a"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4570"/>
      <stop offset="1" stop-color="#0a1122"/>
    </linearGradient>
    <linearGradient id="khole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="1" stop-color="#8fbfff"/>
    </linearGradient>
    <clipPath id="gclip"><circle cx="32" cy="34" r="19"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a1a33"/>

  <!-- globe -->
  <circle cx="32" cy="34" r="19" fill="url(#globe)"/>
  <g clip-path="url(#gclip)" fill="none" stroke="#eaf3ff" stroke-opacity="0.45" stroke-width="0.9">
    <line x1="32" y1="15" x2="32" y2="53"/>
    <ellipse cx="32" cy="34" rx="9" ry="19"/>
    <ellipse cx="32" cy="34" rx="15.5" ry="19"/>
    <line x1="13" y1="34" x2="51" y2="34"/>
    <line x1="16" y1="24.5" x2="48" y2="24.5"/>
    <line x1="16" y1="43.5" x2="48" y2="43.5"/>
  </g>
  <circle cx="32" cy="34" r="19" fill="none" stroke="#7fb4ff" stroke-opacity="0.8" stroke-width="1"/>

  <!-- shield -->
  <path d="M21 20 H43 V35 C43 43 37.5 48 32 51 C26.5 48 21 43 21 35 Z"
        fill="url(#shield)" stroke="#6db3ff" stroke-opacity="0.85" stroke-width="1.1"/>
  <!-- keyhole -->
  <circle cx="32" cy="32" r="2.6" fill="url(#khole)"/>
  <path d="M30.2 33.8 H33.8 L35 42 H29 Z" fill="url(#khole)"/>
</svg>
